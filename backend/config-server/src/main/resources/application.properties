spring.application.name=config-server
server.port=8888
spring.cloud.config.server.git.uri=https://github.com/AKIF-KAREEM/enterprise-chat-platform-config.git
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.username=${GITHUB_USERNAME}
spring.cloud.config.server.git.password=${GITHUB_TOKEN}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true